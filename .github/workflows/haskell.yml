name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.4'
        cabal-version: '3.10'

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.4-cabal-${{ hashFiles('**/*.cabal') }}
        restore-keys: ${{ runner.os }}-ghc-9.4-cabal-

    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies

    - name: Compile selected files
      run: |
        cabal exec -- ghc -isrc -outputdir /tmp/ghc-out -Wall \
          src/Parser.hs
